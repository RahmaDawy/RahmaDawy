<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Rahma Dawy — AI and Data Science" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}.serif{font-family:Fraunces,Georgia,'Times New Roman',serif}
.flt{animation:flt 5s ease-in-out infinite}.c1{animation:flt 6s ease-in-out infinite}.c2{animation:flt 6s ease-in-out -1.5s infinite}.c3{animation:flt 6s ease-in-out -3s infinite}.c4{animation:flt 6s ease-in-out -4.5s infinite}
@keyframes flt{50%{transform:translateY(-12px)}}
.eyes{transform-origin:60px 55px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.arm{transform-origin:92.5px 102px;animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-125deg)}to{transform:rotate(-165deg)}}
.ping{animation:glow 1.4s ease-in-out infinite}@keyframes glow{50%{fill:#F4B79F}}
.spin{transform-origin:900px 60px;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.cur{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
</style>
